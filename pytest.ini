[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .

# Cobertura — requiere: pip install pytest-cov (incluido en requirements.txt)
addopts =
    --cov=src
    --cov=agents
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=60

# feedparser parsea feeds en executor threads; Tkinter Image/Variable quedan en el
# thread secundario y Python lanza RuntimeError al destruirlos desde GC.
# No afecta a la lógica de los tests — es ruido de Tkinter en threads.
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
