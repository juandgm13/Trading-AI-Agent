models:
  technical:         # TechnicalAnalysisAgent (medio plazo — WATCHING)
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.1
    max_tokens: 1024

  technical_entry:   # TechnicalAnalysisAgent (corto plazo — OPPORTUNITY_FOUND)
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.1
    max_tokens: 1024

  economics:         # EconomicsAgent
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.2
    max_tokens: 768

  news_classifier:     # NewsClassifierAgent — clasifica artículos individuales
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.1   # consistencia > creatividad para clasificar
    max_tokens: 256    # respuesta corta (JSON de ~5 campos)

  trader_opportunity:  # TradingAgent — ¿vale la pena vigilar más? (temperatura más alta → más apertura a HOLD)
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.3
    max_tokens: 512

  trader_entry:        # TradingAgent — ¿entrar AHORA? (temperatura baja → más estricto)
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.1
    max_tokens: 512

  orchestrator:        # OrchestratorAgent — gestiona la state machine de todos los símbolos
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.2
    max_tokens: 2048

agents:
  technical_analysis:
    planner: simple
    tools: []
    model_role: technical
    description: "Analyzes OHLCV bar data (medium-term) and returns technical signal JSON"

  technical_entry:
    planner: simple
    tools: []
    model_role: technical_entry
    description: "Analyzes OHLCV bar data (short-term entry timing) and returns technical signal JSON"

  economics_analysis:
    planner: simple
    tools: []
    model_role: economics
    description: "Analyzes news sentiment and market context, returns JSON"

  trading_opportunity:
    planner: simple
    tools: []
    model_role: trader_opportunity
    description: "Evaluates medium-term reports and decides whether to watch more closely"

  trading_entry:
    planner: simple
    tools: []
    model_role: trader_entry
    description: "Evaluates short-term reports and decides whether to open a position NOW"

trading:
  analysis_interval_hours: 4   # cada cuántas horas hacer análisis completo (WATCHING)
  max_position_value: 500       # valor máximo en USD por posición
  poll_interval_seconds: 60
  allow_short_selling: false    # habilitar ventas en corto (solo si el símbolo es shortable)
